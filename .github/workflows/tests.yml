name: tests

on:
  push:
    branches: [master]
    paths-ignore:
      - 'docs/**'
      - '*.md'
  pull_request:
    paths-ignore:
      - 'docs/**'
      - '*.md'

jobs:
  minimal-consumer:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - php: '8.2'
            framework: '^12.0'
          - php: '8.3'
            framework: '^13.0'
          - php: '8.4'
            framework: '^13.0'
          - php: '8.5'
            framework: '^13.0'
    name: Production consumer PHP ${{ matrix.php }} with/without ICU
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240
        with:
          php-version: ${{ matrix.php }}
          extensions: intl, dom, curl, mbstring, pdo_sqlite
          coverage: none
      - name: Install and boot without development dependencies
        run: |
          php tools/consumer-smoke.php prepare "$RUNNER_TEMP/consumer" '${{ matrix.framework }}'
          composer install --working-dir="$RUNNER_TEMP/consumer" --no-dev --no-scripts --prefer-dist --no-interaction
          RANKBEAM_EXPECT_INTL=1 php tools/consumer-smoke.php run "$RUNNER_TEMP/consumer"
          php tools/without-intl.php "$RUNNER_TEMP/no-intl.ini"
          mkdir "$RUNNER_TEMP/empty-ini"
          RANKBEAM_EXPECT_INTL=0 PHP_INI_SCAN_DIR="$RUNNER_TEMP/empty-ini" php -c "$RUNNER_TEMP/no-intl.ini" tools/consumer-smoke.php run "$RUNNER_TEMP/consumer"

  test:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4', '8.5']
        laravel: ['11.*', '12.*', '13.*']
        include:
          - laravel: '11.*'
            testbench: '9.*'
          - laravel: '12.*'
            testbench: '10.*'
          - laravel: '13.*'
            testbench: '11.*'
        exclude:
          # Laravel 11 officially supports PHP 8.2 through 8.4.
          - laravel: '11.*'
            php: '8.5'
          # Laravel 13 requires PHP >= 8.3
          - laravel: '13.*'
            php: '8.2'

    name: PHP ${{ matrix.php }} / Laravel ${{ matrix.laravel }}

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: ${{ matrix.php }}
          # xsl powers the real XSLTProcessor transform in the styled-sitemap
          # escaping test; without it that test self-skips (structural checks
          # still run).
          extensions: dom, xsl, curl, libxml, mbstring, zip, pdo, sqlite, pdo_sqlite
          coverage: none

      - name: Install dependencies
        run: |
          # Laravel 11 is past its bug-fix window and its latest releases carry
          # open security advisories; Composer >=2.9 refuses to resolve them by
          # default. Testing against L11 is the whole point of this matrix leg,
          # so disable advisory blocking for dependency resolution in CI.
          composer config audit.block-insecure false
          composer require "illuminate/support:${{ matrix.laravel }}" "illuminate/database:${{ matrix.laravel }}" "illuminate/console:${{ matrix.laravel }}" "illuminate/http:${{ matrix.laravel }}" "illuminate/routing:${{ matrix.laravel }}" "illuminate/cache:${{ matrix.laravel }}" --no-interaction --no-update
          composer require "orchestra/testbench:${{ matrix.testbench }}" --dev --no-interaction --no-update
          composer update --prefer-dist --no-interaction --with-all-dependencies

      - name: Run tests
        run: vendor/bin/pest --ci
